<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nanoploy</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#071a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nanoploy">
<style>
  :root {
    --board: #0f2f26;
    --board-deep: #071a15;
    --panel: #123a2f;
    --silk: #eaf0ea;
    --silk-dim: #8ea89b;
    --copper: #c9a227;
    --rail: #1c4a3d;
    --alert: #d4614a;
    --radius: 5px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--board-deep);
    color: var(--silk);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 80px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  h1 img { vertical-align: -3px; margin-right: 8px; border-radius: 6px; }
  header .side { display: flex; align-items: center; gap: 10px; }
  header .who { color: var(--silk-dim); font-size: 13px; }
  .langbtn {
    background: transparent; color: var(--silk-dim); border: 1px solid var(--rail);
    border-radius: 4px; font: inherit; font-size: 12px; padding: 2px 8px; cursor: pointer;
  }
  .langbtn:hover { color: var(--copper); border-color: var(--copper); }

  nav { display: flex; margin-bottom: 24px; }
  nav button {
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--silk-dim); font: inherit; padding: 6px 2px; margin-right: 20px; cursor: pointer;
  }
  nav button[aria-selected="true"] { color: var(--silk); border-color: var(--copper); }

  .gauge { background: var(--board); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px; }
  .gauge-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .gauge-value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .gauge-value small { font-size: 14px; font-weight: 400; color: var(--silk-dim); margin-left: 5px; }
  .bar { height: 8px; background: var(--rail); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--copper); transition: width .4s ease; }
  .gauge-note { color: var(--silk-dim); font-size: 13px; margin-top: 10px; }

  .drop {
    border: 1px dashed var(--rail); border-radius: var(--radius); padding: 18px;
    text-align: center; color: var(--silk-dim); margin-bottom: 24px; cursor: pointer;
  }
  .drop.over { border-color: var(--copper); color: var(--silk); background: var(--board); }

  .row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--rail); cursor: pointer; }
  .row:last-of-type { border-bottom: 1px solid var(--rail); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--silk-dim); }
  .dot.awake { background: var(--copper); box-shadow: 0 0 0 3px rgba(201,162,39,.15); }
  .dot.missing { background: var(--alert); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-weight: 500; }
  .row-sub { color: var(--silk-dim); }
  .tag { color: var(--silk-dim); font-size: 12px; border: 1px solid var(--rail); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }

  .detail { background: var(--board); border-radius: var(--radius); padding: 16px; margin: 4px 0 12px; }
  .detail h3 { font-size: 13px; font-weight: 500; color: var(--silk-dim); margin: 18px 0 8px; }
  .detail h3:first-child { margin-top: 0; }
  .field { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

  input, select {
    font: inherit; font-size: 14px; color: var(--silk); background: var(--board-deep);
    border: 1px solid var(--rail); border-radius: 4px; padding: 7px 9px; min-width: 0; flex: 1;
  }
  input::placeholder { color: var(--silk-dim); }
  button.act {
    font: inherit; font-size: 13px; color: var(--silk); background: transparent;
    border: 1px solid var(--rail); border-radius: 4px; padding: 7px 12px; cursor: pointer;
  }
  button.act:hover { border-color: var(--copper); }
  button.act.danger:hover { border-color: var(--alert); color: var(--alert); }
  button.act.primary { border-color: var(--copper); color: var(--copper); }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 12px; background: transparent; border: 1px solid var(--rail); border-radius: 99px; padding: 3px 10px; cursor: pointer; color: var(--silk-dim); }
  .chip[aria-pressed="true"] { border-color: var(--copper); color: var(--copper); }

  pre.logs { background: var(--board-deep); border-radius: 4px; padding: 12px; overflow-x: auto; max-height: 240px; margin: 0; font-size: 12px; color: var(--silk-dim); }
  .empty { color: var(--silk-dim); padding: 26px 0; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
    background: var(--panel); border: 1px solid var(--rail); border-radius: var(--radius);
    padding: 12px 16px; max-width: 92vw; white-space: pre-wrap; font-size: 14px;
  }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img src="/favicon.svg" width="22" height="22" alt="">Nanoploy</h1>
    <div class="side">
      <span class="who" id="who"></span>
      <button class="langbtn" id="lang" title="Switch language"></button>
    </div>
  </header>

  <nav role="tablist">
    <button role="tab" data-view="apps" aria-selected="true"></button>
    <button role="tab" data-view="people" aria-selected="false"></button>
  </nav>

  <section id="view-apps">
    <div class="gauge">
      <div class="gauge-top">
        <div class="gauge-value" id="awake">0<small></small></div>
        <div class="mono" id="sleeping" style="color:var(--silk-dim)"></div>
      </div>
      <div class="bar"><span id="fill" style="width:0%"></span></div>
      <div class="gauge-note" id="gauge-note"></div>
    </div>

    <div class="drop" id="drop">
      <span id="drop-text"></span>
      <input type="file" id="file" accept=".zip" hidden>
    </div>

    <div id="apps"></div>
  </section>

  <section id="view-people" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

/* ---------- i18n ---------- */

const I18N = {
  fr: {
    title: "Nanoploy",
    navApps: "Apps",
    navPeople: "Comptes",
    awakeOne: "app réveillée",
    awakeMany: "apps réveillées",
    asleepSuffix: "en veille",
    gaugeNote: "Une app en veille ne consomme rien. La première requête la réveille en une seconde.",
    dropHtml: 'Glissez un bundle <span class="mono">.zip</span> ici, ou cliquez pour choisir',
    appsEmptyHtml: 'Aucune app déployée. Lancez <span class="mono">npm run deploy</span> depuis un projet.',
    alwaysOn: "toujours active",
    tagPrivate: "privé",
    tagGroups: "groupes",
    accessTitle: "Accès",
    accessPrivate: "Privé, comptes autorisés seulement",
    accessGroups: "Réservé à des groupes",
    accessPublic: "Public, ouvert à tout internet",
    groupsHint: "Créez un groupe dans Comptes.",
    groupPrompt: "Nom du groupe autorisé (créé dans Comptes)",
    madePublic: "Cette app est maintenant ouverte à tout internet.",
    envTitle: "Variables",
    envPlaceholder: "saisir pour remplacer",
    envSave: "Enregistrer",
    nothingToSave: "Rien à enregistrer.",
    envSaved: "Variables enregistrées.",
    logsTitle: "Journal",
    logsLoading: "chargement",
    logsNone: "aucun log",
    logsError: "journal indisponible: ",
    open: "Ouvrir",
    wake: "Réveiller",
    delete: "Supprimer",
    detailNote: "Les apps froides se réveillent toutes seules à la première visite. La base de données est conservée à la suppression.",
    confirmDelete: "Supprimer {slug} ? La base de données sera conservée.",
    deleted: "{slug} supprimée.",
    fail: "Échec: ",
    cpDown: "Control plane injoignable: ",
    sessionExpired: "session expirée, reconnectez-vous",
    unexpected: "réponse inattendue ({status})",
    deploying: "Déploiement de {name}",
    deployFailed: "Échec du déploiement: ",
    accessDenied: "Accès refusé: ",
    peopleOffHtml: 'La gestion des comptes n\'est pas branchée. Créez une clé API dans Pocket ID, mettez-la dans <span class="mono">POCKETID_API_KEY</span>, puis relancez le control plane.',
    openPocketId: "Ouvrir Pocket ID",
    inviteTitle: "Inviter quelqu'un",
    usernamePh: "identifiant",
    emailPh: "email",
    invite: "Inviter",
    inviteHint: "Pas de mot de passe : la personne reçoit un lien et enregistre une clé d'accès.",
    peopleError: "Pocket ID a répondu: ",
    alone: "Vous êtes seul pour le moment.",
    groupsTitle: "Groupes",
    groupPh: "nom du groupe, par exemple famille",
    create: "Créer",
    groupNote: "Un groupe ouvre une app à certaines personnes sans la rendre publique.",
    inviteRequired: "Identifiant et email sont requis.",
    inviteLink: "Lien d'invitation à transmettre :\n",
    created: "Compte créé.",
  },
  en: {
    title: "Nanoploy",
    navApps: "Apps",
    navPeople: "People",
    awakeOne: "app awake",
    awakeMany: "apps awake",
    asleepSuffix: "asleep",
    gaugeNote: "A sleeping app costs nothing. The first request wakes it within a second.",
    dropHtml: 'Drop a <span class="mono">.zip</span> bundle here, or click to choose one',
    appsEmptyHtml: 'No app deployed yet. Run <span class="mono">npm run deploy</span> from a project.',
    alwaysOn: "always on",
    tagPrivate: "private",
    tagGroups: "groups",
    accessTitle: "Access",
    accessPrivate: "Private, allowed accounts only",
    accessGroups: "Restricted to groups",
    accessPublic: "Public, open to the whole internet",
    groupsHint: "Create a group in People first.",
    groupPrompt: "Name of the allowed group (created in People)",
    madePublic: "This app is now open to the whole internet.",
    envTitle: "Variables",
    envPlaceholder: "type to replace",
    envSave: "Save",
    nothingToSave: "Nothing to save.",
    envSaved: "Variables saved.",
    logsTitle: "Logs",
    logsLoading: "loading",
    logsNone: "no logs",
    logsError: "logs unavailable: ",
    open: "Open",
    wake: "Wake",
    delete: "Delete",
    detailNote: "Cold apps wake up on their own at the first visit. The database is kept when you delete an app.",
    confirmDelete: "Delete {slug}? The database will be kept.",
    deleted: "{slug} deleted.",
    fail: "Failed: ",
    cpDown: "Control plane unreachable: ",
    sessionExpired: "session expired, please sign in again",
    unexpected: "unexpected response ({status})",
    deploying: "Deploying {name}",
    deployFailed: "Deploy failed: ",
    accessDenied: "Access denied: ",
    peopleOffHtml: 'Account management is not wired up. Create an API key in Pocket ID, put it in <span class="mono">POCKETID_API_KEY</span> and restart the control plane.',
    openPocketId: "Open Pocket ID",
    inviteTitle: "Invite someone",
    usernamePh: "username",
    emailPh: "email",
    invite: "Invite",
    inviteHint: "No password: the person gets a link and enrolls a passkey.",
    peopleError: "Pocket ID answered: ",
    alone: "You are alone for now.",
    groupsTitle: "Groups",
    groupPh: "group name, e.g. family",
    create: "Create",
    groupNote: "A group opens an app to specific people without making it public.",
    inviteRequired: "Username and email are required.",
    inviteLink: "Invitation link to share:\n",
    created: "Account created.",
  },
};

const savedLang = (() => { try { return localStorage.getItem("nanoploy.lang"); } catch { return null; } })();
let LANG = savedLang === "fr" || savedLang === "en" ? savedLang : (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
let T = I18N[LANG];
const t = (key, vars) => {
  let s = T[key] ?? I18N.fr[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.split("{" + k + "}").join(String(v));
  return s;
};

function renderStatic() {
  document.documentElement.lang = LANG === "fr" ? "fr" : "en";
  document.title = t("title");
  const langBtn = $("lang");
  if (langBtn) langBtn.textContent = LANG === "fr" ? "EN" : "FR";
  document.querySelectorAll("[data-view]").forEach((b) => {
    b.textContent = t(b.dataset.view === "apps" ? "navApps" : "navPeople");
  });
  $("gauge-note").textContent = t("gaugeNote");
  $("drop-text").innerHTML = t("dropHtml");
}

function setLang(lang) {
  LANG = lang;
  T = I18N[LANG];
  try { localStorage.setItem("nanoploy.lang", lang); } catch {}
  renderStatic();
  renderApps();
  if (!$("view-people").hidden) renderPeople(state.peopleError);
}

/* ---------- état ---------- */

const state = { apps: [], open: null, domain: "", people: [], groups: [], peopleReady: false, peopleError: null };
let toastTimer;

function toast(msg, sticky) {
  clearTimeout(toastTimer);
  $("toast").textContent = msg;
  $("toast").hidden = false;
  if (!sticky) toastTimer = setTimeout(() => ($("toast").hidden = true), 5000);
}

const api = async (path, opts = {}) => {
  const res = await fetch(path, {
    ...opts,
    headers: opts.body ? { "content-type": "application/json" } : undefined,
  });
  const type = res.headers.get("content-type") || "";
  if (!type.includes("json")) {
    // expired session or gateway answer: the body is HTML, not a JSON error
    throw new Error(res.status === 401 ? t("sessionExpired") : t("unexpected", { status: res.status }));
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};

/* ---------- apps ---------- */

async function loadApps() {
  try {
    const data = await api("/api/apps");
    state.apps = data.apps;
    renderApps();
  } catch (err) {
    toast(t("cpDown") + err.message);
  }
}

function renderApps() {
  const awake = state.apps.filter((a) => a.status === "awake").length;
  $("awake").innerHTML = awake + "<small>" + (awake === 1 ? t("awakeOne") : t("awakeMany")) + "</small>";
  $("sleeping").textContent = state.apps.filter((a) => a.status === "sleeping").length + " " + t("asleepSuffix");
  $("fill").style.width = (state.apps.length ? (awake / state.apps.length) * 100 : 0) + "%";

  if (!state.apps.length) {
    $("apps").innerHTML = '<p class="empty">' + t("appsEmptyHtml") + "</p>";
    return;
  }
  $("apps").innerHTML = state.apps.map(renderApp).join("");
  bindApps();
}

function accessLabel(a) {
  if (a.access === "public") return "public";
  if (a.access === "groups") return a.groups.join(", ") || t("tagGroups");
  return t("tagPrivate");
}

function renderApp(a) {
  const host = a.slug + "." + state.domain;
  return `
    <div class="row" data-open="${a.slug}">
      <span class="dot ${a.status}"></span>
      <div class="row-main">
        <div class="row-title">${esc(a.name)}</div>
        <div class="row-sub mono">${esc(host)}</div>
      </div>
      ${a.warm ? `<span class="tag">${t("alwaysOn")}</span>` : ""}
      <span class="tag">${esc(accessLabel(a))}</span>
    </div>
    ${state.open === a.slug ? renderDetail(a, host) : ""}`;
}

function renderDetail(a, host) {
  const groupChips = state.groups
    .map((g) => `<button class="chip" data-group="${esc(g.name)}" data-slug="${a.slug}"
        aria-pressed="${a.groups.includes(g.name)}">${esc(g.name)}</button>`)
    .join("");

  return `<div class="detail">
    <h3>${t("accessTitle")}</h3>
    <div class="field">
      <select data-access="${a.slug}">
        <option value="private" ${a.access === "private" ? "selected" : ""}>${t("accessPrivate")}</option>
        <option value="groups" ${a.access === "groups" ? "selected" : ""}>${t("accessGroups")}</option>
        <option value="public" ${a.access === "public" ? "selected" : ""}>${t("accessPublic")}</option>
      </select>
    </div>
    ${a.access === "groups" ? `<div class="chips">${groupChips || `<span class="row-sub">${t("groupsHint")}</span>`}</div>` : ""}

    ${a.envKeys.length ? `<h3>${t("envTitle")}</h3>${a.envKeys.map((k) => `
      <div class="field">
        <input class="mono" value="${esc(k)}" readonly style="max-width:210px">
        <input type="password" placeholder="${t("envPlaceholder")}" data-env="${a.slug}" data-key="${esc(k)}">
      </div>`).join("")}
      <button class="act" data-saveenv="${a.slug}">${t("envSave")}</button>` : ""}

    <h3>${t("logsTitle")}</h3>
    <pre class="logs" data-logs="${a.slug}">${t("logsLoading")}</pre>

    <div class="actions">
      <a class="act" href="https://${esc(host)}" target="_blank" rel="noopener" style="text-decoration:none">${t("open")}</a>
      ${a.status === "sleeping" && a.warm ? `<button class="act" data-wake="${a.slug}">${t("wake")}</button>` : ""}
      <button class="act danger" data-delete="${a.slug}">${t("delete")}</button>
    </div>
    <p class="row-sub" style="font-size:13px;margin:12px 0 0">${t("detailNote")}</p>
  </div>`;
}

function bindApps() {
  const fail = (fn) => async (...args) => {
    try {
      await fn(...args);
    } catch (err) {
      toast(t("fail") + err.message);
    }
  };

  document.querySelectorAll("[data-open]").forEach((el) => {
    el.onclick = () => {
      state.open = state.open === el.dataset.open ? null : el.dataset.open;
      renderApps();
      if (state.open) loadLogs(state.open);
    };
  });

  document.querySelectorAll("[data-access]").forEach((el) => {
    el.onchange = fail(async (e) => {
      e.stopPropagation();
      const app = state.apps.find((a) => a.slug === el.dataset.access);
      let groups = app.groups;
      if (el.value === "groups" && !groups.length) {
        // first time in groups mode: ask for a group name, otherwise the API
        // would reject the empty list and the select would snap back
        const name = prompt(t("groupPrompt"));
        if (!name) return renderApps();
        groups = [name];
      }
      await api(`/api/apps/${app.slug}/access`, {
        method: "POST",
        body: JSON.stringify({ access: el.value, groups }),
      });
      if (el.value === "public") toast(t("madePublic"));
      loadApps();
    });
    el.onclick = (e) => e.stopPropagation();
  });

  document.querySelectorAll("[data-group]").forEach((el) => {
    el.onclick = fail(async (e) => {
      e.stopPropagation();
      const app = state.apps.find((a) => a.slug === el.dataset.slug);
      const name = el.dataset.group;
      const groups = app.groups.includes(name)
        ? app.groups.filter((g) => g !== name)
        : [...app.groups, name];
      await api(`/api/apps/${app.slug}/access`, {
        method: "POST",
        body: JSON.stringify({ access: "groups", groups }),
      });
      loadApps();
    });
  });

  document.querySelectorAll("[data-env]").forEach((el) => (el.onclick = (e) => e.stopPropagation()));

  document.querySelectorAll("[data-saveenv]").forEach((el) => {
    el.onclick = fail(async (e) => {
      e.stopPropagation();
      const slug = el.dataset.saveenv;
      const patch = {};
      document.querySelectorAll(`[data-env="${slug}"]`).forEach((i) => {
        if (i.value) patch[i.dataset.key] = i.value;
      });
      if (!Object.keys(patch).length) return toast(t("nothingToSave"));
      await api(`/api/apps/${slug}/env`, { method: "POST", body: JSON.stringify(patch) });
      toast(t("envSaved"));
      loadApps();
    });
  });

  document.querySelectorAll("[data-wake]").forEach((el) => {
    el.onclick = fail(async (e) => {
      e.stopPropagation();
      await api(`/api/apps/${el.dataset.wake}/wake`, { method: "POST" });
      loadApps();
    });
  });

  document.querySelectorAll("[data-delete]").forEach((el) => {
    el.onclick = fail(async (e) => {
      e.stopPropagation();
      const slug = el.dataset.delete;
      if (!confirm(t("confirmDelete", { slug }))) return;
      await api(`/api/apps/${slug}`, { method: "DELETE" });
      state.open = null;
      toast(t("deleted", { slug }));
      loadApps();
    });
  });
}

async function loadLogs(slug) {
  const el = document.querySelector(`[data-logs="${slug}"]`);
  if (!el) return;
  try {
    const { lines } = await api(`/api/apps/${slug}/logs`);
    el.textContent = lines.slice(-40).join("\n") || t("logsNone");
  } catch (err) {
    el.textContent = t("logsError") + err.message;
  }
}

/* ---------- comptes ---------- */

async function loadPeople() {
  const data = await api("/api/people").catch((e) => ({ error: e.message, configured: true, people: [], groups: [] }));
  state.people = data.people ?? [];
  state.groups = data.groups ?? [];
  state.peopleReady = data.configured !== false;
  state.peopleError = data.error ?? null;
  renderPeople(state.peopleError);
}

function renderPeople(error) {
  const view = $("view-people");

  if (!state.peopleReady) {
    view.innerHTML = `<p class="empty">${t("peopleOffHtml")}</p>
      <a class="act" href="https://id.${esc(state.domain)}" target="_blank" rel="noopener"
         style="text-decoration:none">${t("openPocketId")}</a>`;
    return;
  }

  view.innerHTML = `
    <h3 style="font-size:13px;font-weight:500;color:var(--silk-dim);margin:0 0 10px">${t("inviteTitle")}</h3>
    <div class="field">
      <input id="new-username" placeholder="${t("usernamePh")}" autocomplete="off">
      <input id="new-email" type="email" placeholder="${t("emailPh")}" autocomplete="off">
      <button class="act primary" id="invite">${t("invite")}</button>
    </div>
    <p class="row-sub" style="font-size:13px;margin:0 0 24px">${t("inviteHint")}</p>

    ${error ? `<p class="empty">${t("peopleError")}${esc(error)}</p>` : ""}

    ${state.people.map((p) => `
      <div class="row" style="cursor:default">
        <span class="dot ${p.isAdmin ? "awake" : ""}"></span>
        <div class="row-main">
          <div class="row-title">${esc(p.displayName)}</div>
          <div class="row-sub mono">${esc(p.email || p.username)}</div>
        </div>
        <div class="chips">
          ${state.groups.map((g) => `<button class="chip" data-person="${p.id}" data-gid="${g.id}"
              aria-pressed="${p.groups.includes(g.name)}">${esc(g.name)}</button>`).join("")}
        </div>
      </div>`).join("") || `<p class="empty">${t("alone")}</p>`}

    <h3 style="font-size:13px;font-weight:500;color:var(--silk-dim);margin:24px 0 10px">${t("groupsTitle")}</h3>
    <div class="field">
      <input id="new-group" placeholder="${t("groupPh")}">
      <button class="act" id="add-group">${t("create")}</button>
    </div>
    <p class="row-sub" style="font-size:13px;margin:0">${t("groupNote")}</p>`;

  $("invite").onclick = async () => {
    const username = $("new-username").value.trim();
    const email = $("new-email").value.trim();
    if (!username || !email) return toast(t("inviteRequired"));
    try {
      const res = await api("/api/people", { method: "POST", body: JSON.stringify({ username, email }) });
      toast(res.link ? t("inviteLink") + res.link : t("created"), true);
      loadPeople();
    } catch (err) {
      toast(t("fail") + err.message);
    }
  };

  $("add-group").onclick = async () => {
    const name = $("new-group").value.trim();
    if (!name) return;
    try {
      await api("/api/groups", { method: "POST", body: JSON.stringify({ name }) });
      loadPeople();
    } catch (err) {
      toast(t("fail") + err.message);
    }
  };

  document.querySelectorAll("[data-person]").forEach((el) => {
    el.onclick = async () => {
      try {
        const person = state.people.find((p) => p.id === el.dataset.person);
        const group = state.groups.find((g) => g.id === el.dataset.gid);
        const names = person.groups.includes(group.name)
          ? person.groups.filter((n) => n !== group.name)
          : [...person.groups, group.name];
        const ids = state.groups.filter((g) => names.includes(g.name)).map((g) => g.id);
        await api(`/api/people/${person.id}/groups`, {
          method: "POST",
          body: JSON.stringify({ groupIds: ids }),
        });
        loadPeople();
      } catch (err) {
        toast(t("fail") + err.message);
      }
    };
  });
}

/* ---------- déploiement ---------- */

async function upload(file) {
  toast(t("deploying", { name: file.name }), true);
  const form = new FormData();
  form.append("bundle", file);
  try {
    const res = await fetch("/api/deploy", { method: "POST", body: form });
    const type = res.headers.get("content-type") || "";
    const data = type.includes("json") ? await res.json() : {};
    toast(res.ok ? [data.url, ...(data.log || [])].join("\n") : t("fail") + (data.error || res.statusText), true);
  } catch (err) {
    toast(t("deployFailed") + err.message, true);
  }
  loadApps();
}

const drop = $("drop");
drop.onclick = () => $("file").click();
$("file").onchange = (e) => e.target.files[0] && upload(e.target.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
};

/* ---------- démarrage ---------- */

$("lang").onclick = () => setLang(LANG === "fr" ? "en" : "fr");
renderStatic();

document.querySelectorAll("[data-view]").forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll("[data-view]").forEach((t) =>
      t.setAttribute("aria-selected", String(t === tab)));
    $("view-apps").hidden = tab.dataset.view !== "apps";
    $("view-people").hidden = tab.dataset.view !== "people";
    if (tab.dataset.view === "people") loadPeople();
  };
});

api("/api/me")
  .then((me) => {
    state.domain = me.domain || location.hostname.split(".").slice(1).join(".");
    $("who").textContent = me.name || me.email || "";
    loadApps();
    loadPeople();
  })
  .catch((err) => toast(t("accessDenied") + err.message, true));

// refresh the list, but never while a detail panel is open
setInterval(() => { if (!state.open) loadApps(); }, 6000);
</script>
</body>
</html>
