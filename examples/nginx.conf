# Host-installed Nginx in front of Nanodeploy. Replace apps.example.com and
# certificate paths; the certificate must cover *.apps.example.com.
# Use DNS-01 to issue/renew a wildcard certificate with your ACME client.
server {
    listen 80;
    server_name apps.example.com *.apps.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name apps.example.com *.apps.example.com;
    ssl_certificate /etc/letsencrypt/live/apps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.example.com/privkey.pem;
    client_max_body_size 101m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite client-supplied forwarding headers at the public edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
