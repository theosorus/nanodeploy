# Nanodeploy manifest. This file is the whole contract with the platform.
name: Mon app
slug: mon-app            # becomes mon-app.<APPS_DOMAIN>, [a-z0-9-] only
access: private          # public | private | groups. Applied when the app is
                         # created; afterwards the dashboard owns it
groups: []               # only used when access is groups
roles: []                # roles this app understands, e.g. [moderator]. Who
                         # holds them is decided in the dashboard
protect: []              # paths that need a role, checked by the gateway:
                         #   - { path: /api/admin/*, role: moderator }
frontend: true
backend:
  entry: server.js       # bundled by npm run build, never a folder
  port: 3000
database:
  enabled: true
  migrations: ./migrations
idle:
  timeout: 10m           # scale to zero after this much inactivity
  warm: false            # true = always running, restarts with the machine, ~40 Mo
env: []                  # names only, values are set in the dashboard
# Only for deploys from a Git repository (the server builds it); a zip ignores it.
# build:
#   image: node:20-bookworm-slim
#   install: npm ci
#   command: npm run build
