# This proxy remains root-equivalent by design: only the control plane may
# reach it. Explicit method/path rules keep unrelated Docker subsystems closed.
global
    log stdout format raw local0
    maxconn 256
    nbthread 2
    hard-stop-after 5s

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 15m
    timeout server 15m
    timeout tunnel 15m
    timeout http-request 10s

frontend dockerfrontend
    bind :2375
    acl read_method method GET HEAD
    acl read_path path_reg ^(/v[0-9.]+)?/(containers(/.*)?|images(/.*)?|networks(/.*)?|volumes(/.*)?|exec/[a-f0-9]+/json|info|version|_ping|events)$
    acl write_method method POST PUT DELETE
    acl write_path path_reg ^(/v[0-9.]+)?/(build|containers/(create|[^/]+(/(start|stop|kill|exec|wait|archive))?)|exec/[a-f0-9]+/start|images/(create|.+)|networks/(create|[^/]+(/(connect|disconnect))?)|volumes/(create|[^/]+))$
    acl event_path path_reg ^(/v[0-9.]+)?/events$
    http-request allow if read_method read_path
    http-request allow if write_method write_path
    http-request deny
    use_backend events if event_path
    default_backend dockerbackend

backend dockerbackend
    server dockersocket /var/run/docker.sock

backend events
    timeout server 24h
    server dockersocket /var/run/docker.sock
