# Every rule is method-specific and anchored. Enabling the stock CONTAINERS
# and POST switches together would expose container creation and exec too.
global
    log stdout format raw local0
    maxconn 256
    nbthread 2
    hard-stop-after 5s

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s

frontend dockerfrontend
    bind :2375
    acl read_method method GET HEAD
    acl read_path path_reg ^(/v[0-9.]+)?/(containers/json|containers/app-[a-z][a-z0-9-]{1,62}/json|events|info|version|_ping)$
    acl write_method method POST
    acl lifecycle_path path_reg ^(/v[0-9.]+)?/containers/app-[a-z][a-z0-9-]{1,62}/(start|stop|wait)$
    acl start_path path_reg ^(/v[0-9.]+)?/containers/app-[a-z][a-z0-9-]{1,62}/start$
    acl stop_path path_reg ^(/v[0-9.]+)?/containers/app-[a-z][a-z0-9-]{1,62}/stop$
    acl list_path path_reg ^(/v[0-9.]+)?/containers/json$
    acl event_path path_reg ^(/v[0-9.]+)?/events$
    # Inspection by a platform name or an opaque ID would expose its Env,
    # including the root deploy token. Sablier uses app names from this list.
    http-request set-query 'all=1&filters={"label":["sablier.enable=true","nanodeploy.slug"]}' if list_path
    # Exec events can contain command arguments. Only lifecycle/health events
    # of managed apps are needed, regardless of the caller's query parameters.
    http-request set-query 'filters={"type":["container"],"label":["sablier.enable=true","nanodeploy.slug"],"event":["start","stop","die","create","destroy","oom","health_status"]}' if event_path
    # No checkpoint restore or unbounded stop timeout through this proxy.
    http-request set-query %[str()] if start_path
    http-request set-query 't=2' if stop_path
    http-request allow if read_method read_path
    http-request allow if write_method lifecycle_path
    http-request deny
    use_backend events if event_path
    default_backend dockerbackend

backend dockerbackend
    server dockersocket /var/run/docker.sock

backend events
    timeout server 24h
    server dockersocket /var/run/docker.sock
