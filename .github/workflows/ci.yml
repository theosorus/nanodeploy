name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nanodeploy-audit-local-only
          POSTGRES_DB: nanodeploy_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
        working-directory: control-plane
      - run: npm run typecheck
        working-directory: control-plane
      - run: npm ci
        working-directory: gate
      - run: npm test
        working-directory: control-plane
        env:
          NANODEPLOY_TEST_DATABASE_URL: postgres://postgres:nanodeploy-audit-local-only@127.0.0.1:5432/nanodeploy_audit
      - run: npm run build
        working-directory: control-plane

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gate/package-lock.json
      - run: npm ci
        working-directory: gate
      - run: npm run typecheck
        working-directory: gate
      # the access rules are the security boundary: tested on their own
      - run: npm test
        working-directory: gate
      - run: npm run build
        working-directory: gate

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dashboard has no build step; validate the merged language catalogues
      # and exercise the guard against broken scripts and missing translations.
      - name: parse and check translations
        run: |
          node --test scripts/check-dashboard.test.mjs
          node scripts/check-dashboard.mjs

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh e2e/smoke.sh
      - run: node --test scripts/update-security.test.mjs
      # pinned: an action on @master can change under you between two runs
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate the compose file
        run: |
          cp .env.example .env
          sed -i 's/^APPS_DOMAIN=.*/APPS_DOMAIN=apps.ci.test/' .env
          sed -i 's/^DEPLOY_TOKEN=.*/DEPLOY_TOKEN=ci/' .env
          docker compose config -q
