version: 2
updates:
  - package-ecosystem: npm
    directory: /control-plane
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /gate
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /templates/app-template
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: [/control-plane, /gate, /caddy, /egress, /docker-proxy]
    schedule: {interval: weekly}
