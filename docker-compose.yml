name: nanodeploy

# external: created once by install.sh. App containers live on these networks
# without being part of this compose project, so compose must never delete them.
networks:
  edge:
    name: nanodeploy_edge
    external: true
  data:
    name: nanodeploy_data
    external: true
  # No exposed service shares a network with a Docker socket proxy.
  console:
    name: nanodeploy_console
    external: true
  wake:
    name: nanodeploy_wake
    external: true
  docker:
    name: nanodeploy_docker
    external: true
  sablier_control:
    name: nanodeploy_sablier_control
    external: true
  gate_data:
    name: nanodeploy_gate_data
    external: true
  legacy:
    name: nanodeploy_legacy
    external: true
  # Legacy network, retained for existing installs. New app containers use
  # their own internal nanodeploy_app_<slug> bridge, created by the control plane.
  apps:
    name: nanodeploy_apps
    external: true
  # Internal, without a host gateway. Builders reach public HTTP(S) through
  # the filtered egress service, which holds no platform credentials.
  build:
    name: nanodeploy_build_secure
    external: true
  egress:
    name: nanodeploy_egress
    external: true

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  pocketid_data:
  # caddy's access log, read by the control plane for analytics
  caddy_logs:

services:
  # Only this service gives apps/builds access to public HTTP(S). It has no
  # socket, database credentials or host files. Direct private/LAN traffic has
  # no route from an app, and the proxy refuses private and metadata addresses.
  egress:
    build: ./egress
    image: nanodeploy/egress:latest
    restart: unless-stopped
    networks: [egress, build]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
  caddy:
    build:
      context: ./caddy
      args:
        CADDY_VERSION: ${CADDY_VERSION:-2.11.9}
    image: nanodeploy/caddy:with-sablier
    restart: unless-stopped
    environment:
      APPS_DOMAIN: ${APPS_DOMAIN}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32 ::1/128}
    ports:
      # host port is overridable: on some hosts 8080 is already taken
      - "127.0.0.1:${CADDY_PORT:-8080}:80"
    volumes:
      # the directory, not the file: git and rsync replace a file by renaming a
      # new inode over it, and a single-file bind mount keeps showing the old
      # one until the container is recreated. A Caddyfile edit that silently
      # does nothing after "git pull" is the worst kind of upgrade bug.
      - ./caddy:/etc/caddy:ro
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      - ${APPS_DIR}:/srv/apps:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    # Pairwise access to gate, console and Sablier. The control plane connects
    # Caddy to each app's private network for its reverse_proxy targets.
    networks: [edge, console, wake]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /srv/apps/.snapshots:ro,noexec,nosuid,nodev,size=1m
      - /srv/apps/.builds:ro,noexec,nosuid,nodev,size=1m
      - /srv/apps/.staging:ro,noexec,nosuid,nodev,size=1m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging: &bounded_logs
      driver: local
      options: {max-size: "10m", max-file: "3"}

  sablier:
    image: sablierapp/sablier:${SABLIER_VERSION:-1.17.0}
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
    environment:
      # never the raw socket: sablier only has to start and stop containers, and
      # ":ro" on a socket mount restricts nothing at all (it is the API that
      # writes, not the file). Its own proxy cannot build images or exec.
      DOCKER_HOST: tcp://sablier-socket:2375
    networks: [wake, sablier_control]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging: *bounded_logs
    depends_on: [sablier-socket]

  # least privilege for sablier: list, inspect, start, stop, watch events
  sablier-socket:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-0.3.0}
    restart: unless-stopped
    # CONTAINERS=1 + POST=1 in the stock proxy also permits create and exec.
    # This explicit ACL allows read operations and start/stop only.
    entrypoint: [haproxy, -W, -db, -f, /etc/nanodeploy/sablier.cfg]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-proxy/sablier.cfg:/etc/nanodeploy/sablier.cfg:ro
    networks: [sablier_control]
    read_only: true
    tmpfs: ["/run:rw,noexec,nosuid,nodev,size=1m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    logging: *bounded_logs

  # the control plane's own proxy: it builds images, so this one is powerful.
  # Nothing on nanodeploy_apps can reach it, which is the whole point of the
  # network split: reaching :2375 is equivalent to root on the host.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-0.3.0}
    restart: unless-stopped
    environment:
      # least privilege: only what the control plane actually needs
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      BUILD: 1
      EXEC: 1
      VOLUMES: 1
      # analytics follow app containers waking up, sleeping and crashing
      EVENTS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8m", "/run:rw,noexec,nosuid,nodev,size=1m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    logging: *bounded_logs

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nanodeploy
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
    volumes:
      - pg_data:/var/lib/postgresql/data
    # App bridges are connected dynamically. Neither app, gate nor control
    # plane shares a database network with either of the other two.
    networks: [data, gate_data]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    logging: *bounded_logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Accounts, sign-in, sessions, app roles and access checks. It answers
  # strangers on the internet, so it holds no docker access and its database
  # role (nd_gate, created by the control plane) sees its own schema and the few
  # columns of the apps table an access decision needs.
  gate:
    build: ./gate
    image: nanodeploy/gate:latest
    restart: unless-stopped
    environment:
      APPS_DOMAIN: ${APPS_DOMAIN}
      DATABASE_URL: postgres://nd_gate:${GATE_DB_PASSWORD}@postgres:5432/nanodeploy
      # what the browser sees, in front of the tunnel or reverse proxy
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
    # edge for caddy, data for postgres; never apps
    networks: [edge, gate_data]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 128
    logging: *bounded_logs
    depends_on:
      postgres:
        condition: service_healthy

  # Pocket ID held the accounts before gate. It only runs when asked
  # ("docker compose --profile legacy up -d pocket-id"), so the control plane can
  # import its accounts with their ids on an upgrade. A fresh install skips it.
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:${POCKETID_VERSION:-v2.14.0}
    profiles: [legacy]
    restart: unless-stopped
    environment:
      APP_URL: https://id.${APPS_DOMAIN}
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: ${POCKETID_ENCRYPTION_KEY:-unused-on-fresh-installs}
    volumes:
      - pocketid_data:/app/data
    networks: [legacy]

  control-plane:
    build: ./control-plane
    image: nanodeploy/control-plane:latest
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # container-side path: APPS_DIR on the host is only used for the mounts
      APPS_DIR: /srv/apps
      APPS_DOMAIN: ${APPS_DOMAIN}
      CADDY_CONF_DIR: /etc/caddy/conf.d
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nanodeploy
      DEFAULT_APP_MEMORY_MB: 256
      # creates the gate role and schema, manages accounts in it
      GATE_DB_PASSWORD: ${GATE_DB_PASSWORD}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
      # analytics: where a day starts, for "today" and the daily visitor count
      TIMEZONE: ${TIMEZONE:-UTC}
      # encrypts forge credentials (GitHub App key, GitLab tokens) at rest
      NANODEPLOY_SECRET_KEY: ${NANODEPLOY_SECRET_KEY}
      # upgrade only: import accounts from a Pocket ID still running (legacy)
      POCKETID_URL: http://pocket-id:1411
      POCKETID_API_KEY: ${POCKETID_API_KEY:-}
    volumes:
      - ${APPS_DIR}:/srv/apps
      - ./caddy/conf.d:/etc/caddy/conf.d
      - caddy_logs:/var/log/caddy:ro
    networks: [console, docker, data, legacy]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=768m"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 256
    logging: *bounded_logs
    depends_on:
      caddy:
        condition: service_started
      egress:
        condition: service_started
      postgres:
        condition: service_healthy
