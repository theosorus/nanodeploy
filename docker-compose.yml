name: nanodeploy

# external: created once by install.sh. App containers live on these networks
# without being part of this compose project, so compose must never delete them.
networks:
  edge:
    name: nanodeploy_edge
    external: true
  data:
    name: nanodeploy_data
    external: true
  # app containers join this one: it only carries caddy and postgres. The
  # platform services on nanodeploy_edge (socket-proxy especially) must stay
  # unreachable from an app, which is arbitrary code.
  apps:
    name: nanodeploy_apps
    external: true

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  pocketid_data:
  # caddy's access log, read by the control plane for analytics
  caddy_logs:

services:
  caddy:
    build:
      context: ./caddy
      args:
        CADDY_VERSION: ${CADDY_VERSION:-2.11.4}
    image: nanodeploy/caddy:with-sablier
    restart: unless-stopped
    environment:
      APPS_DOMAIN: ${APPS_DOMAIN}
      # exact token for the CLI bypass matcher in the Caddyfile
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
    ports:
      # host port is overridable: on some hosts 8080 is already taken
      - "127.0.0.1:${CADDY_PORT:-8080}:80"
    volumes:
      # the directory, not the file: git and rsync replace a file by renaming a
      # new inode over it, and a single-file bind mount keeps showing the old
      # one until the container is recreated. A Caddyfile edit that silently
      # does nothing after "git pull" is the worst kind of upgrade bug.
      - ./caddy:/etc/caddy:ro
      - ./caddy/conf.d:/etc/caddy/conf.d
      - ${APPS_DIR}:/srv/apps:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    # edge for gate and sablier, apps for the reverse_proxy targets
    networks: [edge, apps]

  sablier:
    image: sablierapp/sablier:${SABLIER_VERSION:-1.17.0}
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
    environment:
      # never the raw socket: sablier only has to start and stop containers, and
      # ":ro" on a socket mount restricts nothing at all (it is the API that
      # writes, not the file). Its own proxy cannot build images or exec.
      DOCKER_HOST: tcp://sablier-socket:2375
    networks: [edge]
    depends_on: [sablier-socket]

  # least privilege for sablier: list, inspect, start, stop, watch events
  sablier-socket:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-0.3.0}
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]

  # the control plane's own proxy: it builds images, so this one is powerful.
  # Nothing on nanodeploy_apps can reach it, which is the whole point of the
  # network split: reaching :2375 is equivalent to root on the host.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-0.3.0}
    restart: unless-stopped
    environment:
      # least privilege: only what the control plane actually needs
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      BUILD: 1
      EXEC: 1
      VOLUMES: 1
      # analytics follow app containers waking up, sleeping and crashing
      EVENTS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nanodeploy
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
    volumes:
      - pg_data:/var/lib/postgresql/data
    # data carries the control plane, apps carries the app containers. Postgres
    # sits on both so each side reaches it on its own network, and apps never
    # share a network with the control plane. Postgres publishes no port, so
    # being on the non-internal apps network does not expose it to the internet.
    networks: [data, apps]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Accounts, sign-in, sessions, app roles and access checks. It answers
  # strangers on the internet, so it holds no docker access and its database
  # role (nd_gate, created by the control plane) sees its own schema and the few
  # columns of the apps table an access decision needs.
  gate:
    build: ./gate
    image: nanodeploy/gate:latest
    restart: unless-stopped
    environment:
      APPS_DOMAIN: ${APPS_DOMAIN}
      DATABASE_URL: postgres://nd_gate:${GATE_DB_PASSWORD}@postgres:5432/nanodeploy
      # what the browser sees, in front of the tunnel or reverse proxy
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
    # edge for caddy, data for postgres; never apps
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy

  # Pocket ID held the accounts before gate. It only runs when asked
  # ("docker compose --profile legacy up -d pocket-id"), so the control plane can
  # import its accounts with their ids on an upgrade. A fresh install skips it.
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:${POCKETID_VERSION:-v2.14.0}
    profiles: [legacy]
    restart: unless-stopped
    environment:
      APP_URL: https://id.${APPS_DOMAIN}
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: ${POCKETID_ENCRYPTION_KEY:-unused-on-fresh-installs}
    volumes:
      - pocketid_data:/app/data
    networks: [edge]

  control-plane:
    build: ./control-plane
    image: nanodeploy/control-plane:latest
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # container-side path: APPS_DIR on the host is only used for the mounts
      APPS_DIR: /srv/apps
      APPS_DOMAIN: ${APPS_DOMAIN}
      CADDY_CONF_DIR: /etc/caddy/conf.d
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nanodeploy
      DEFAULT_APP_MEMORY_MB: 256
      # creates the gate role and schema, manages accounts in it
      GATE_DB_PASSWORD: ${GATE_DB_PASSWORD}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
      # analytics: where a day starts, for "today" and the daily visitor count
      TIMEZONE: ${TIMEZONE:-UTC}
      # upgrade only: import accounts from a Pocket ID still running (legacy)
      POCKETID_URL: http://pocket-id:1411
      POCKETID_API_KEY: ${POCKETID_API_KEY:-}
    volumes:
      - ${APPS_DIR}:/srv/apps
      - ./caddy/conf.d:/etc/caddy/conf.d
      - caddy_logs:/var/log/caddy:ro
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
