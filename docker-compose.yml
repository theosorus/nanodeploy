name: nanoploy

# external: created once by install.sh. App containers live on these networks
# without being part of this compose project, so compose must never delete them.
networks:
  edge:
    name: nanoploy_edge
    external: true
  data:
    name: nanoploy_data
    external: true
  # app containers join this one: it only carries caddy and postgres. The
  # platform services on nanoploy_edge (socket-proxy especially) must stay
  # unreachable from an app, which is arbitrary code.
  apps:
    name: nanoploy_apps
    external: true

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  pocketid_data:
  tinyauth_data:

services:
  caddy:
    build:
      context: ./caddy
      args:
        CADDY_VERSION: ${CADDY_VERSION:-2.11.4}
    image: nanoploy/caddy:with-sablier
    restart: unless-stopped
    environment:
      APPS_DOMAIN: ${APPS_DOMAIN}
      # exact token for the CLI bypass matcher in the Caddyfile
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
    ports:
      # host port is overridable: on some hosts 8080 is already taken
      - "127.0.0.1:${CADDY_PORT:-8080}:80"
    volumes:
      # the directory, not the file: git and rsync replace a file by renaming a
      # new inode over it, and a single-file bind mount keeps showing the old
      # one until the container is recreated. A Caddyfile edit that silently
      # does nothing after "git pull" is the worst kind of upgrade bug.
      - ./caddy:/etc/caddy:ro
      - ./caddy/conf.d:/etc/caddy/conf.d
      - ${APPS_DIR}:/srv/apps:ro
      - caddy_data:/data
      - caddy_config:/config
    # edge for tinyauth/sablier/pocket-id, apps for the reverse_proxy targets
    networks: [edge, apps]

  sablier:
    image: sablierapp/sablier:${SABLIER_VERSION:-1.17.0}
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
    environment:
      # never the raw socket: sablier only has to start and stop containers, and
      # ":ro" on a socket mount restricts nothing at all (it is the API that
      # writes, not the file). Its own proxy cannot build images or exec.
      DOCKER_HOST: tcp://sablier-socket:2375
    networks: [edge]
    depends_on: [sablier-socket]

  # least privilege for sablier: list, inspect, start, stop, watch events
  sablier-socket:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-0.3.0}
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]

  # the control plane's own proxy: it builds images, so this one is powerful.
  # Nothing on nanoploy_apps can reach it, which is the whole point of the
  # network split: reaching :2375 is equivalent to root on the host.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-0.3.0}
    restart: unless-stopped
    environment:
      # least privilege: only what the control plane actually needs
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      BUILD: 1
      EXEC: 1
      VOLUMES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nanoploy
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 20s
      timeout: 5s
      retries: 5

  # pinned on purpose: pocket-id migrates its database forward on start and does
  # not migrate back, so an unattended jump to a new major is a one-way trip
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:${POCKETID_VERSION:-v2.14.0}
    restart: unless-stopped
    environment:
      APP_URL: https://id.${APPS_DOMAIN}
      TRUST_PROXY: "true"
      # newer pocket-id builds refuse to start without an explicit key
      ENCRYPTION_KEY: ${POCKETID_ENCRYPTION_KEY}
    volumes:
      - pocketid_data:/app/data
    networks: [edge]

  # v5: env vars are prefixed TINYAUTH_ (v3 env names are gone), sessions live
  # in a sqlite database under /data, SECRET no longer exists
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:${TINYAUTH_VERSION:-v5.1.3}
    restart: unless-stopped
    environment:
      TINYAUTH_APPURL: https://auth.${APPS_DOMAIN}
      TINYAUTH_OAUTH_PROVIDERS_GENERIC_CLIENTID: ${OIDC_CLIENT_ID}
      TINYAUTH_OAUTH_PROVIDERS_GENERIC_CLIENTSECRET: ${OIDC_CLIENT_SECRET}
      TINYAUTH_OAUTH_PROVIDERS_GENERIC_NAME: Pocket ID
      TINYAUTH_OAUTH_PROVIDERS_GENERIC_AUTHURL: https://id.${APPS_DOMAIN}/authorize
      TINYAUTH_OAUTH_PROVIDERS_GENERIC_TOKENURL: https://id.${APPS_DOMAIN}/api/oidc/token
      TINYAUTH_OAUTH_PROVIDERS_GENERIC_USERINFOURL: https://id.${APPS_DOMAIN}/api/oidc/userinfo
      TINYAUTH_OAUTH_PROVIDERS_GENERIC_SCOPES: openid email profile groups
      TINYAUTH_AUTH_TRUSTEDPROXIES: 172.16.0.0/12
      TINYAUTH_ANALYTICS_ENABLED: "false"
    volumes:
      - tinyauth_data:/data
    networks: [edge]

  control-plane:
    build: ./control-plane
    image: nanoploy/control-plane:latest
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # container-side path: APPS_DIR on the host is only used for the mounts
      APPS_DIR: /srv/apps
      APPS_DOMAIN: ${APPS_DOMAIN}
      CADDY_CONF_DIR: /etc/caddy/conf.d
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
      # optional: browser sessions must be in this tinyauth group to drive the
      # platform. Leave empty for a single-admin setup.
      ADMIN_GROUP: ${ADMIN_GROUP:-}
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nanoploy
      DEFAULT_APP_MEMORY_MB: 256
      POCKETID_URL: http://pocket-id:1411
      POCKETID_PUBLIC_URL: https://id.${APPS_DOMAIN}
      POCKETID_API_KEY: ${POCKETID_API_KEY}
    volumes:
      - ${APPS_DIR}:/srv/apps
      - ./caddy/conf.d:/etc/caddy/conf.d
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
